{% extends "base.html" %}

{% block title %}Create Team &bull; ChameleonOS{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="form-card">
    <div style="margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;">Register Hackathon Team</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Form a team to build and submit projects together</p>
    </div>

    {% if error %}
    <div class="alert-banner alert-danger" style="margin-bottom: 1.25rem; font-size: 0.85rem;">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/teams/new">
      <div class="form-group">
        <label class="form-label" for="event_id">Select Hackathon Event</label>
        <select class="form-select" id="event_id" name="event_id" required>
          {% for event in events %}
            <option value="{{ event.id }}" {% if active_event_id == event.id %}selected{% endif %}>
              {{ event.title }} ({{ event.phase }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Team Name</label>
        <input class="form-input" type="text" id="name" name="name" required placeholder="e.g. Distributed Neurons">
        <div class="form-hint">You will automatically be designated as Team Lead</div>
      </div>

      <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.75rem;">
        <a href="/events" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          Create Team &rarr;
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
