<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ChameleonOS{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="/" class="logo">
        <span>🦎 ChameleonOS</span>
        <span class="badge">DOGFOOD 2026</span>
      </a>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>System Ready</span>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    <div class="container">
      <p>ChameleonOS &copy; 2026 &bull; Self-Hostable Adaptive Hackathon Platform &bull; MIT License</p>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
