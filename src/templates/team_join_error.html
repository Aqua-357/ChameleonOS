{% extends "base.html" %}

{% block title %}Unable to Join Team &bull; ChameleonOS{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚠️</div>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Invitation Error</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
      {{ error or "The invite token is invalid, has already been redeemed, or has expired." }}
    </p>

    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="/events" class="btn btn-secondary">Browse Events</a>
      <a href="/teams/new" class="btn btn-primary">Create Your Own Team</a>
    </div>
  </div>
</div>
{% endblock %}
